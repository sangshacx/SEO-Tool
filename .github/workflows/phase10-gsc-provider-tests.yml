name: Phase 10 GSC Provider Tests

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - src/v2/providers/google-search-console.js
      - src/v2/providers/google-oauth.js
      - src/v2/security/secret-crypto.js
      - src/v2/security/access-request.js
      - src/v2/gsc/**
      - src/v2/storage/gsc-connections.js
      - functions/api/v2/gsc/**
      - migrations/0014_gsc_connections.sql
      - tests/dashboard-test-helpers.mjs
      - tests/secret-crypto.test.mjs
      - tests/google-oauth.test.mjs
      - tests/gsc-oauth-state.test.mjs
      - tests/gsc-connections-storage.test.mjs
      - tests/gsc-connect-api.test.mjs
      - public/v2-gsc-settings.js
      - public/v2-shell.js
      - public/v2-shell.css
      - tests/gsc-settings-ui.test.mjs
      - tests/v2-shell-navigation.test.mjs
      - tests/v2-shell-ui.test.mjs
      - migrations/0015_gsc_search_analytics.sql
      - migrations/0021_gsc_search_appearance_capabilities.sql
      - src/v2/gsc/sync-plan.js
      - src/v2/storage/gsc-search-analytics.js
      - functions/api/v2/gsc/sync.js
      - tests/gsc-sync-plan.test.mjs
      - tests/gsc-search-analytics-storage.test.mjs
      - tests/gsc-generative-ai-capability.test.mjs
      - tests/gsc-sync-api.test.mjs
      - src/v2/gsc/intelligence.js
      - src/v2/gsc/cannibalization.js
      - functions/api/v2/gsc/intelligence.js
      - tests/gsc-intelligence.test.mjs
      - tests/gsc-cannibalization.test.mjs
      - tests/gsc-intelligence-api.test.mjs
      - public/v2-gsc-intelligence-ui.js
      - public/v2-organic-intelligence.js
      - public/v2-organic-intelligence.css
      - tests/gsc-intelligence-ui.test.mjs
      - tests/organic-shell-integration.test.mjs
      - src/v2/intelligence/organic-opportunities.js
      - functions/api/v2/organic/opportunities.js
      - public/v2-organic-opportunity-ui.js
      - tests/organic-opportunities.test.mjs
      - tests/organic-opportunities-api.test.mjs
      - tests/organic-opportunity-ui.test.mjs
      - tests/google-search-console-provider.test.mjs
      - .github/workflows/phase10-gsc-provider-tests.yml

permissions:
  contents: read

jobs:
  test-gsc-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 10 GSC provider tests
        run: node --test tests/google-search-console-provider.test.mjs tests/secret-crypto.test.mjs tests/google-oauth.test.mjs tests/gsc-oauth-state.test.mjs tests/gsc-connections-storage.test.mjs tests/gsc-connect-api.test.mjs tests/gsc-settings-ui.test.mjs tests/v2-shell-navigation.test.mjs tests/v2-shell-ui.test.mjs tests/gsc-sync-plan.test.mjs tests/gsc-search-analytics-storage.test.mjs tests/gsc-generative-ai-capability.test.mjs tests/gsc-sync-api.test.mjs tests/gsc-intelligence.test.mjs tests/gsc-intelligence-api.test.mjs tests/gsc-intelligence-ui.test.mjs tests/organic-shell-integration.test.mjs tests/organic-opportunities.test.mjs tests/organic-opportunities-api.test.mjs tests/organic-opportunity-ui.test.mjs tests/gsc-cannibalization.test.mjs
