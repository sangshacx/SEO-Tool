name: Competitor Gap Action Event
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/competitor-gap-action-event.yml"
permissions:
  contents: write
jobs:
  edit-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
          fetch-depth: 0
      - name: Wire local Keyword Gap event
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path("public/v2.html")
          text=path.read_text()
          old='document.getElementById("gapResult").classList.remove("hidden");box.textContent=gapMeta.cached?"分析成功：缓存命中，本次费用 $0。":"分析成功：真实费用已记录。";await loadUsage()'
          new='document.getElementById("gapResult").classList.remove("hidden");window.dispatchEvent(new CustomEvent("seo-pro-v2:keyword-gap-ready",{detail:{data,meta:gapMeta}}));box.textContent=gapMeta.cached?"分析成功：缓存命中，本次费用 $0。":"分析成功：真实费用已记录。";await loadUsage()'
          if old not in text:
              raise SystemExit("keyword gap success anchor not found")
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Validate
        run: |
          git diff --check
          node --test
          grep -F 'seo-pro-v2:keyword-gap-ready' public/v2.html
      - name: Commit event wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2.html
          git commit -m "feat: wire Keyword Gap action brief event"
          git push origin HEAD:seo-pro-v2
