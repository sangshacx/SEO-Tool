name: Repair V2 HTML truncation

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - .github/workflows/repair-v2-html.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
          fetch-depth: 0

      - name: Restore truncated V2 shell content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path("public/v2.html")
          current = path.read_text(encoding="utf-8")

          bad_prefix = (
              "Warning: truncated output (original token count: 39288)\n"
              "Total output lines: 312\n\n"
          )
          if not current.startswith(bad_prefix):
              raise SystemExit("Expected truncation header was not found at the start of public/v2.html")
          current = current[len(bad_prefix):]

          marker = "…9288 tokens truncated…"
          if current.count(marker) != 1:
              raise SystemExit(f"Expected exactly one truncation marker, found {current.count(marker)}")

          before, after = current.split(marker)
          parent = subprocess.check_output(
              ["git", "show", "393cb6c9^:public/v2.html"],
              text=True,
              encoding="utf-8",
          )

          def unique_anchor(source, edge, side):
              for size in (320, 256, 192, 160, 128, 96, 72, 56, 40):
                  anchor = edge[-size:] if side == "before" else edge[:size]
                  if anchor and source.count(anchor) == 1:
                      return anchor
              raise SystemExit(f"Could not find a unique {side} anchor in the clean parent")

          left = unique_anchor(parent, before, "before")
          right = unique_anchor(parent, after, "after")
          left_pos = parent.index(left)
          right_pos = parent.index(right, left_pos + len(left))
          if right_pos <= left_pos:
              raise SystemExit("Recovered anchors are out of order")

          missing = parent[left_pos + len(left):right_pos]
          repaired = before + missing + after

          if "truncated output" in repaired.lower() or "tokens truncated" in repaired.lower():
              raise SystemExit("A truncation marker remains after repair")
          if not repaired.startswith("<!doctype html>"):
              raise SystemExit("Repaired file does not begin with <!doctype html>")

          path.write_text(repaired, encoding="utf-8")
          print(f"Restored {len(missing)} characters between clean anchors.")
          PY

      - name: Run regression tests
        shell: bash
        run: |
          git diff --check
          node --test

      - name: Commit repaired shell and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/repair-v2-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2.html .github/workflows/repair-v2-html.yml
          git commit -m "fix: restore truncated V2 shell"
          git push origin HEAD:seo-pro-v2
