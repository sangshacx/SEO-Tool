name: Cloudflare Preview Storage Check

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - .github/workflows/cloudflare-preview-storage-check.yml

permissions:
  contents: read

jobs:
  verify-preview-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Assert keyword and metrics row
        shell: bash
        run: |
          output="$(npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote --yes --command "SELECT k.keyword, m.search_volume, m.cpc_usd, m.actual_cost_usd FROM keywords k JOIN keyword_metrics m ON m.keyword_id = k.id WHERE k.normalized_keyword = 'waterproof membrane' ORDER BY m.fetched_at DESC LIMIT 1;")"
          printf '%s\n' "$output"
          grep -q '"keyword": "waterproof membrane"' <<<"$output"
          grep -q '"search_volume": 6600' <<<"$output"
          grep -q '"actual_cost_usd": 0.01212' <<<"$output"

      - name: Assert corrected cached usage row
        shell: bash
        run: |
          output="$(npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote --yes --command "SELECT request_id, result_count, actual_cost_usd, cache_hit, status, http_status FROM api_usage WHERE request_id = '7bd0e603-4529-4333-9b47-c5a87328e24b';")"
          printf '%s\n' "$output"
          grep -q '"request_id": "7bd0e603-4529-4333-9b47-c5a87328e24b"' <<<"$output"
          grep -q '"result_count": 1' <<<"$output"
          grep -q '"actual_cost_usd": 0' <<<"$output"
          grep -q '"cache_hit": 1' <<<"$output"
          grep -q '"status": "success"' <<<"$output"
          grep -q '"http_status": 200' <<<"$output"
