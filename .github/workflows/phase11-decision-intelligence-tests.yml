name: Phase 11 Decision Intelligence Tests

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - src/v2/intelligence/organic-opportunities.js
      - functions/api/v2/organic/opportunities.js
      - public/v2-organic-opportunity-ui.js
      - public/v2-organic-intelligence.css
      - public/v2-dashboard.js
      - public/v2-dashboard.css
      - public/v2-shell.js
      - src/v2/gsc/intelligence.js
      - src/v2/gsc/cannibalization.js
      - src/v2/storage/gsc-search-analytics.js
      - src/v2/storage/seo-action-workflow.js
      - src/v2/intelligence/decision-workflow.js
      - src/v2/intelligence/seo-action-outcomes.js
      - src/v2/intelligence/cannibalization-actions.js
      - src/v2/intelligence/ai-visibility-actions.js
      - src/v2/intelligence/ai-prompt-actions.js
      - src/v2/intelligence/ai-prompt-trends.js
      - src/v2/intelligence/ai-prompt-outcomes.js
      - src/v2/storage/ai-visibility.js
      - src/v2/storage/ai-prompt-tracker.js
      - migrations/0018_ai_visibility_history.sql
      - functions/api/v2/organic/action-workflow.js
      - tests/organic-opportunities.test.mjs
      - tests/organic-opportunities-api.test.mjs
      - tests/organic-opportunity-ui.test.mjs
      - tests/gsc-intelligence.test.mjs
      - tests/gsc-cannibalization.test.mjs
      - tests/gsc-intelligence-api.test.mjs
      - tests/v2-dashboard-view.test.mjs
      - tests/v2-shell-ui.test.mjs
      - tests/seo-action-workflow.test.mjs
      - tests/seo-action-workflow-api.test.mjs
      - tests/seo-action-outcomes.test.mjs
      - tests/cannibalization-actions.test.mjs
      - tests/ai-visibility-actions.test.mjs
      - tests/ai-prompt-actions.test.mjs
      - tests/ai-prompt-trends.test.mjs
      - tests/ai-prompt-outcomes.test.mjs
      - tests/ai-prompt-tracker-storage.test.mjs
      - tests/dashboard-test-helpers.mjs
      - migrations/0014_gsc_connections.sql
      - migrations/0015_gsc_search_analytics.sql
      - migrations/0016_seo_action_workflow.sql
      - migrations/0017_seo_action_workflow_events.sql
      - migrations/0019_ai_prompt_tracker.sql
      - migrations/0020_ai_prompt_workflow_links.sql
      - .github/workflows/phase11-decision-intelligence-tests.yml

permissions:
  contents: read

jobs:
  test-decision-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 11 decision intelligence tests
        run: node --test tests/organic-opportunities.test.mjs tests/organic-opportunities-api.test.mjs tests/organic-opportunity-ui.test.mjs tests/gsc-intelligence.test.mjs tests/gsc-intelligence-api.test.mjs tests/v2-dashboard-view.test.mjs tests/v2-shell-ui.test.mjs tests/seo-action-workflow.test.mjs tests/seo-action-workflow-api.test.mjs tests/seo-action-outcomes.test.mjs tests/gsc-cannibalization.test.mjs tests/cannibalization-actions.test.mjs tests/ai-visibility-actions.test.mjs tests/ai-prompt-actions.test.mjs tests/ai-prompt-trends.test.mjs tests/ai-prompt-outcomes.test.mjs tests/ai-prompt-tracker-storage.test.mjs
