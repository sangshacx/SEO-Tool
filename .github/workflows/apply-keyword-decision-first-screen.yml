name: Apply Keyword Decision First Screen
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/apply-keyword-decision-first-screen.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
      - name: Apply first-screen changes
        run: python .github/scripts/apply-keyword-decision-first-screen.py
      - name: Run regression tests
        run: |
          git diff --check
          node --test
      - name: Commit and clean up
        run: |
          rm .github/workflows/apply-keyword-decision-first-screen.yml
          rm .github/scripts/apply-keyword-decision-first-screen.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2.html tests/keyword-decision-ui.test.mjs .github/workflows/apply-keyword-decision-first-screen.yml .github/scripts/apply-keyword-decision-first-screen.py
          git commit -m "feat: make keyword explorer decision first"
          git push origin HEAD:seo-pro-v2
