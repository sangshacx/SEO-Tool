name: Keyword Library UI Redesign
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/keyword-library-ui-redesign.yml"
permissions:
  contents: write
jobs:
  edit-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
          fetch-depth: 0
      - name: Redesign Keyword Library workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          path = Path("public/v2-keyword-library.js")
          text = path.read_text()

          start = text.index("export function createKeywordLibrarySection")
          end = text.index("\nexport function mountKeywordLibrary", start)

          replacement = r'''export function createKeywordLibrarySection(documentLike = globalThis.document) {
            const section = documentLike.createElement("section");
            section.className = "panel v2-keyword-library";
            section.dataset.v2View = "keyword-library";
            section.dataset.v2KeywordLibrary = "";
            section.innerHTML = `
              <div class="v2-library-hero">
                <div>
                  <div class="v2-library-eyebrow">KEYWORD ASSETS</div>
                  <h2>关键词库</h2>
                  <p>保存、筛选和组织值得持续跟踪的关键词，再把它们分配到 Topic Cluster。</p>
                </div>
                <div class="v2-library-hero-actions">
                  <span class="v2-cost-pill">D1 管理 · $0</span>
                  <button type="button" data-v2-library-refresh>刷新数据</button>
                </div>
              </div>

              <div class="v2-library-tabs" role="tablist" aria-label="关键词库视图">
                <button type="button" role="tab" aria-selected="true" class="active" data-v2-library-tab="keywords">全部关键词</button>
                <button type="button" role="tab" aria-selected="false" data-v2-library-tab="clusters">Topic Clusters</button>
                <button type="button" role="tab" aria-selected="false" data-v2-library-tab="intelligence">Cluster Intelligence</button>
              </div>

              <div class="v2-library-panel active" data-v2-library-panel="keywords">
                <div class="v2-library-filterbar">
                  <div class="v2-library-search">
                    <span aria-hidden="true">⌕</span>
                    <input type="search" data-v2-library-query placeholder="搜索已保存关键词">
                  </div>
                  <input type="search" data-v2-library-tag placeholder="筛选 Tag">
                  <select data-v2-library-sort aria-label="关键词库排序">
                    <option value="created_at">最近保存</option>
                    <option value="search_volume">搜索量</option>
                    <option value="keyword_difficulty">KD</option>
                    <option value="cpc_usd">CPC</option>
                    <option value="keyword">关键词</option>
                  </select>
                  <select data-v2-library-order aria-label="关键词库排序方向">
                    <option value="desc">降序</option>
                    <option value="asc">升序</option>
                  </select>
                </div>

                <div class="v2-library-bulkbar">
                  <div class="v2-library-bulk-left">
                    <span class="v2-selection-count" data-v2-library-selected>已选择 0 条</span>
                    <button type="button" data-v2-library-select-page>选择当前页</button>
                    <button type="button" data-v2-library-clear-selected>清空</button>
                  </div>
                  <div class="v2-library-bulk-right">
                    <input type="text" data-v2-library-batch-tags placeholder="添加 Tag，例如 Commercial, Saudi">
                    <button type="button" class="secondary-action" data-v2-library-add-tags>添加 Tag</button>
                    <button type="button" class="danger-action" data-v2-library-delete-selected>删除已选</button>
                  </div>
                  <span data-v2-library-batch-status class="v2-library-batch-status"></span>
                </div>

                <div data-v2-library-status class="status"></div>

                <div class="v2-library-table-shell">
                  <div class="tablewrap">
                    <table class="ideastable v2-library-table">
                      <thead>
                        <tr>
                          <th>选择</th>
                          <th>关键词</th>
                          <th>搜索量</th>
                          <th>KD</th>
                          <th>CPC</th>
                          <th>Intent</th>
                          <th>市场</th>
                          <th>Tags</th>
                          <th>来源</th>
                          <th>指标时间</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody data-v2-library-body></tbody>
                    </table>
                  </div>
                  <div class="v2-library-pager">
                    <span data-v2-library-summary>—</span>
                    <div>
                      <button type="button" data-v2-library-prev>上一页</button>
                      <button type="button" data-v2-library-next>下一页</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="v2-library-panel" data-v2-library-panel="clusters" hidden>
                <div class="v2-workspace-section-head">
                  <div>
                    <h3>Topic Clusters</h3>
                    <p>用 Primary / Supporting 组织关键词。选择关键词后，在这里完成手动分配。</p>
                  </div>
                  <button type="button" data-v2-cluster-refresh>刷新 Cluster</button>
                </div>

                <div class="v2-cluster-compose">
                  <div class="v2-field">
                    <label>目标 Cluster</label>
                    <select data-v2-cluster-select aria-label="选择 Topic Cluster">
                      <option value="">选择 Topic Cluster</option>
                    </select>
                  </div>
                  <div class="v2-field v2-field-grow">
                    <label>新建 Cluster</label>
                    <input type="text" maxlength="80" data-v2-cluster-name placeholder="输入 Cluster 名称">
                  </div>
                  <button type="button" class="primary-action" data-v2-cluster-create>创建 Cluster</button>
                  <div class="v2-field">
                    <label>Primary Keyword</label>
                    <select data-v2-cluster-primary aria-label="选择 Primary Keyword">
                      <option value="">选择 Primary Keyword</option>
                    </select>
                  </div>
                  <button type="button" class="primary-action" data-v2-cluster-assign>分配已选关键词</button>
                </div>

                <div class="v2-inline-help">
                  已有 Cluster 成员会保留；现有 Primary 默认保留。已选词若属于其他 Cluster，会移动到当前 Cluster。全部操作 $0。
                </div>
                <div data-v2-cluster-status class="v2-cluster-status"></div>
                <div data-v2-cluster-list class="v2-cluster-list"></div>
              </div>

              <div class="v2-library-panel" data-v2-library-panel="intelligence" hidden>
                <div class="v2-workspace-section-head">
                  <div>
                    <h3>Cluster Intelligence <span>v0.1</span></h3>
                    <p>基于关键词结构与已缓存 Intent 的只读建议。Cannibalization 仅表示潜在风险。</p>
                  </div>
                  <button type="button" class="primary-action" data-v2-cluster-intelligence-run>分析 Cluster 建议</button>
                </div>
                <div data-v2-cluster-intelligence-status class="v2-cluster-intelligence-status"></div>
                <div data-v2-cluster-intelligence-summary class="v2-cluster-intelligence-summary"></div>
                <div class="v2-library-table-shell">
                  <div class="tablewrap v2-cluster-intelligence-tablewrap">
                    <table class="ideastable v2-cluster-intelligence-table">
                      <thead>
                        <tr>
                          <th>Keyword</th>
                          <th>建议</th>
                          <th>建议 Cluster</th>
                          <th>Match</th>
                          <th>Cannibalization</th>
                          <th>原因</th>
                          <th>下一步</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody data-v2-cluster-intelligence-body>
                        <tr><td colspan="8" class="emptyrow">点击“分析 Cluster 建议”生成只读建议。本次 $0。</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            `;
            return section;
          }
          '''
          text = text[:start] + replacement + text[end:]

          refs_anchor = '''  const keywordInput = root.querySelector("#keyword");'''
          refs_new = '''  const libraryTabs = [...section.querySelectorAll("[data-v2-library-tab]")];
            const libraryPanels = [...section.querySelectorAll("[data-v2-library-panel]")];
            const keywordInput = root.querySelector("#keyword");'''
          text = replace_once(text, refs_anchor, refs_new, "tab refs")

          status_anchor = '''  const showStatus = (message = "", type = "info") => {'''
          tab_logic = r'''  const activateLibraryTab = (tabId) => {
              const target = ["keywords", "clusters", "intelligence"].includes(tabId) ? tabId : "keywords";
              libraryTabs.forEach((button) => {
                const active = button.dataset.v2LibraryTab === target;
                button.classList.toggle("active", active);
                button.setAttribute("aria-selected", active ? "true" : "false");
              });
              libraryPanels.forEach((panel) => {
                const active = panel.dataset.v2LibraryPanel === target;
                panel.hidden = !active;
                panel.classList.toggle("active", active);
              });
              return target;
            };

            libraryTabs.forEach((button) => {
              button.addEventListener("click", () => activateLibraryTab(button.dataset.v2LibraryTab));
            });

          '''
          text = replace_once(text, status_anchor, tab_logic + status_anchor, "tab logic")

          text = text.replace(
              '    clusterSelect.scrollIntoView?.({ behavior: "smooth", block: "center" });',
              '    activateLibraryTab("clusters");\n    clusterSelect.scrollIntoView?.({ behavior: "smooth", block: "center" });',
          )
          text = text.replace(
              '    clusterNameInput.focus?.();\n    clusterNameInput.scrollIntoView?.({ behavior: "smooth", block: "center" });',
              '    activateLibraryTab("clusters");\n    clusterNameInput.focus?.();\n    clusterNameInput.scrollIntoView?.({ behavior: "smooth", block: "center" });',
          )

          init_anchor = '''  renderClusterSelect();
            renderClusterList();
            clearClusterIntelligence();'''
          init_new = '''  activateLibraryTab("keywords");
            renderClusterSelect();
            renderClusterList();
            clearClusterIntelligence();'''
          text = replace_once(text, init_anchor, init_new, "initial tab")
          path.write_text(text)

          css_path = Path("public/v2-shell.css")
          css = css_path.read_text()
          css += r'''

          /* Keyword Library workspace redesign */
          .v2-keyword-library{
            padding:0!important;
            border:0!important;
            background:transparent!important;
            box-shadow:none!important;
          }
          .v2-library-hero{
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:20px;
            padding:4px 2px 18px;
          }
          .v2-library-eyebrow{
            margin-bottom:6px;
            font-size:10px;
            font-weight:800;
            letter-spacing:.16em;
            color:#6f93c6;
          }
          .v2-library-hero h2{
            margin:0;
            font-size:24px;
            line-height:1.2;
            color:#edf4ff;
          }
          .v2-library-hero p{
            max-width:720px;
            margin:7px 0 0;
            color:#8098b9;
            font-size:13px;
          }
          .v2-library-hero-actions{
            display:flex;
            align-items:center;
            gap:9px;
          }
          .v2-cost-pill{
            display:inline-flex;
            align-items:center;
            min-height:32px;
            padding:0 10px;
            border:1px solid #203b5d;
            border-radius:999px;
            background:#0c1c30;
            color:#7ea6d8;
            font-size:11px;
            font-weight:700;
            white-space:nowrap;
          }
          .v2-library-hero-actions button,
          .v2-workspace-section-head button{
            min-height:34px;
            padding:0 12px;
            border:1px solid #27486f;
            border-radius:8px;
            background:#10243c;
            color:#b7cae5;
            font-weight:700;
          }
          .v2-library-tabs{
            display:flex;
            gap:4px;
            margin-bottom:14px;
            padding:4px;
            width:max-content;
            max-width:100%;
            border:1px solid #1d3554;
            border-radius:10px;
            background:#0b1829;
          }
          .v2-library-tabs button{
            min-height:34px;
            padding:0 14px;
            border:0;
            border-radius:7px;
            background:transparent;
            color:#7188a9;
            font-size:12px;
            font-weight:750;
          }
          .v2-library-tabs button.active{
            background:#172b49;
            color:#e8f1ff;
            box-shadow:inset 0 0 0 1px #294d77;
          }
          .v2-library-panel{
            border:1px solid #1b3352;
            border-radius:12px;
            background:#0c192b;
            overflow:hidden;
          }
          .v2-library-panel[hidden]{display:none!important}
          .v2-library-filterbar{
            display:grid;
            grid-template-columns:minmax(280px,1.8fr) minmax(150px,.8fr) 150px 100px;
            gap:8px;
            padding:14px;
            border-bottom:1px solid #172d49;
            background:#0d1d32;
          }
          .v2-library-filterbar input,
          .v2-library-filterbar select,
          .v2-cluster-compose input,
          .v2-cluster-compose select{
            min-height:38px;
            border:1px solid #233d5d;
            border-radius:8px;
            background:#0b1728;
            color:#dce7f7;
          }
          .v2-library-search{
            position:relative;
          }
          .v2-library-search span{
            position:absolute;
            left:12px;
            top:50%;
            transform:translateY(-50%);
            color:#607a9d;
            pointer-events:none;
          }
          .v2-library-search input{
            width:100%;
            padding-left:32px;
          }
          .v2-library-bulkbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            flex-wrap:wrap;
            padding:10px 14px;
            border-bottom:1px solid #172d49;
            background:#0a1727;
          }
          .v2-library-bulk-left,
          .v2-library-bulk-right{
            display:flex;
            align-items:center;
            gap:7px;
            flex-wrap:wrap;
          }
          .v2-selection-count{
            min-width:76px;
            color:#9bb2d2;
            font-size:11px;
            font-weight:700;
          }
          .v2-library-bulkbar button,
          .v2-library-pager button{
            min-height:30px;
            padding:0 9px;
            border:1px solid #243f62;
            border-radius:7px;
            background:#102038;
            color:#93aac9;
            font-size:11px;
            font-weight:700;
          }
          .v2-library-bulkbar input{
            min-height:32px;
            min-width:260px;
            border:1px solid #243f62;
            border-radius:7px;
            background:#0b1728;
          }
          .v2-library-bulkbar .secondary-action{
            border-color:#28594e;
            background:#102d29;
            color:#92d7bd;
          }
          .v2-library-bulkbar .danger-action{
            border-color:#5d3140;
            background:#291522;
            color:#d994a4;
          }
          .v2-library-table-shell{
            background:#0b1727;
          }
          .v2-library-table,
          .v2-cluster-intelligence-table{
            min-width:1160px;
          }
          .v2-library-table thead th,
          .v2-cluster-intelligence-table thead th{
            background:#0d1d32;
            color:#6f8cb3;
            font-size:10px;
            text-transform:uppercase;
            letter-spacing:.06em;
            border-bottom:1px solid #1e3859;
          }
          .v2-library-table tbody tr,
          .v2-cluster-intelligence-table tbody tr{
            background:#0b1727;
          }
          .v2-library-table tbody tr:hover,
          .v2-cluster-intelligence-table tbody tr:hover{
            background:#0f2036;
          }
          .v2-library-table td,
          .v2-cluster-intelligence-table td{
            border-bottom:1px solid #152b47;
          }
          .v2-library-keyword{
            color:#9fc2f7;
            font-weight:750;
          }
          .v2-library-pager{
            display:flex;
            justify-content:space-between;
