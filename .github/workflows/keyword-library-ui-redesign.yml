            text-transform:uppercase;
            letter-spacing:.05em;
          }
          .v2-cluster-compose .primary-action,
          .v2-workspace-section-head .primary-action{
            min-height:38px;
            border-color:#2a5a52;
            background:#12302c;
            color:#9bd8c1;
          }
          .v2-inline-help{
            margin:0 18px 4px;
            padding:9px 11px;
            border-left:2px solid #31547d;
            background:#0b1727;
            color:#6f86a5;
            font-size:11px;
            line-height:1.55;
          }
          .v2-cluster-status,
          .v2-cluster-intelligence-status,
          .v2-cluster-intelligence-summary{
            margin-left:18px;
            margin-right:18px;
          }
          .v2-cluster-list{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
            gap:10px;
            padding:12px 18px 18px;
          }
          .v2-cluster-card{
            padding:13px;
            border:1px solid #1f3959;
            border-radius:10px;
            background:#0d1d31;
          }
          .v2-cluster-card-head{
            display:flex;
            justify-content:space-between;
            gap:10px;
          }
          .v2-cluster-primary{
            margin-top:10px;
            color:#94d8bd;
            font-size:12px;
          }
          .v2-cluster-supporting{
            margin-top:6px;
            color:#7088a8;
            font-size:11px;
            line-height:1.55;
          }
          .v2-cluster-empty{
            padding:18px;
            border:1px dashed #28496f;
            border-radius:10px;
            color:#7088a8;
            background:#0a1727;
            font-size:12px;
          }
          .v2-cluster-intelligence-tablewrap{
            border-top:1px solid #172d49;
          }
          .v2-cluster-intelligence-summary{
            margin-top:0;
            padding:0 0 12px;
            color:#7ea6d8;
            font-size:11px;
          }
          .v2-cluster-adopt{
            border-radius:7px;
          }
          @media(max-width:1100px){
            .v2-library-filterbar{grid-template-columns:1fr 1fr}
            .v2-cluster-compose{grid-template-columns:1fr 1fr}
            .v2-cluster-compose button{min-height:38px}
          }
          @media(max-width:720px){
            .v2-library-hero,
            .v2-workspace-section-head{flex-direction:column}
            .v2-library-tabs{width:100%;overflow:auto}
            .v2-library-tabs button{flex:0 0 auto}
            .v2-library-filterbar,
            .v2-cluster-compose{grid-template-columns:1fr}
            .v2-library-bulkbar{align-items:flex-start}
            .v2-library-bulk-left,
            .v2-library-bulk-right{width:100%}
            .v2-library-bulkbar input{min-width:0;flex:1}
          }
          '''
          css_path.write_text(css)

          test_path = Path("tests/keyword-library-ui.test.mjs")
          tests = test_path.read_text()
          if 'test("Keyword Library redesign uses three workspace tabs' not in tests:
              tests += r'''

          test("Keyword Library redesign uses three workspace tabs without changing backend contracts", async () => {
            const source = await readFile(new URL("../public/v2-keyword-library.js", import.meta.url), "utf8");
            assert.match(source, /data-v2-library-tab="keywords"/);
            assert.match(source, /data-v2-library-tab="clusters"/);
            assert.match(source, /data-v2-library-tab="intelligence"/);
            assert.match(source, /data-v2-library-panel="keywords"/);
            assert.match(source, /data-v2-library-panel="clusters"/);
            assert.match(source, /data-v2-library-panel="intelligence"/);
            assert.match(source, /activateLibraryTab\("keywords"\)/);
            assert.match(source, /activateLibraryTab\("clusters"\)/);
            assert.match(source, /保存、筛选和组织值得持续跟踪的关键词/);
            assert.match(source, /D1 管理 · \$0/);
          });
          '''
          test_path.write_text(tests)
          PY
      - name: Validate
        run: |
          git diff --check
          node --test
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2-keyword-library.js public/v2-shell.css tests/keyword-library-ui.test.mjs
          git commit -m "feat: redesign Keyword Library workspace"
          git push origin HEAD:seo-pro-v2
