name: Cluster Intelligence Evidence UI
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/cluster-intelligence-evidence-ui.yml"
permissions:
  contents: write
jobs:
  edit-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
          fetch-depth: 0
      - name: Expose SERP evidence in Cluster Intelligence UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          js_path = Path("public/v2-keyword-library.js")
          text = js_path.read_text()

          helper_anchor = '''export function clusterIntelligenceDecisionLabel(code, fallback = "") {
            return ({
              assign_to_existing: "建议归入现有 Cluster",
              review_cluster_fit: "需要人工复核",
              new_cluster_candidate: "更适合新建 Cluster",
            })[String(code || "").toLowerCase()] || fallback || "—";
          }
          '''
          helpers = r'''

          export function clusterSerpEvidencePresentation(evidence = {}) {
            const status = String(evidence?.status || "unavailable").toLowerCase();
            const strength = String(evidence?.strength || "none").toLowerCase();
            if (status === "available") {
              const strengthLabel = ({
                strong: "强",
                moderate: "中",
                weak: "弱",
              })[strength] || "弱";
              return {
                status,
                strength,
                label: `${strengthLabel} · ${Number(evidence?.score ?? 0)}%`,
                shared_label: `${Number(evidence?.shared_url_count ?? 0)} 个`,
                shared_urls: Array.isArray(evidence?.shared_urls) ? evidence.shared_urls : [],
              };
            }
            return {
              status,
              strength: "none",
              label: ({
                stale: "已过期",
                insufficient: "证据不足",
                market_mismatch: "市场不同",
                unavailable: "暂无 SERP",
              })[status] || "暂无 SERP",
              shared_label: "—",
              shared_urls: [],
            };
          }

          export function clusterConfidencePresentation(confidence = {}) {
            const level = String(confidence?.level || "medium").toLowerCase();
            return {
              level,
              label: ({
                high: "高",
                medium: "中",
                low: "低",
              })[level] || "中",
              score: Number.isFinite(Number(confidence?.score)) ? Number(confidence.score) : null,
              reason: clean(confidence?.reason),
            };
          }
          '''
          text = replace_once(text, helper_anchor, helper_anchor + helpers, "evidence presentation helpers")

          header_old = '''                <th>Match</th>
                <th>Cannibalization</th>'''
          header_new = '''                <th>Match</th>
                <th>SERP Overlap</th>
                <th>Shared URLs</th>
                <th>Confidence</th>
                <th>Cannibalization</th>'''
          text = replace_once(text, header_old, header_new, "intelligence table headers")
          text = text.replace('colspan="8" class="emptyrow">点击“分析 Cluster 建议”生成只读建议。本次 $0。</td>', 'colspan="11" class="emptyrow">点击“分析 Cluster 建议”生成只读建议。本次 $0。</td>', 1)

          clear_old = '''    cell.colSpan = 8;
            cell.className = "emptyrow";'''
          clear_new = '''    cell.colSpan = 11;
            cell.className = "emptyrow";'''
          text = replace_once(text, clear_old, clear_new, "clear intelligence colspan")

          summary_old = '''      `高潜在蚕食风险 ${summaryData.potential_cannibalization_high ?? 0}`,
              summaryData.truncated ? "仅分析最近 250 个 Saved Keywords" : null,'''
          summary_new = '''      `高潜在蚕食风险 ${summaryData.potential_cannibalization_high ?? 0}`,
              `SERP 证据 ${summaryData.serp_evidence_available ?? 0}/${summaryData.unassigned_keywords ?? 0} · 覆盖 ${summaryData.serp_evidence_coverage_pct ?? 0}%`,
              (summaryData.serp_evidence_strong ?? 0) > 0 ? `强 SERP 证据 ${summaryData.serp_evidence_strong}` : null,
              (summaryData.serp_evidence_stale ?? 0) > 0 ? `过期 SERP ${summaryData.serp_evidence_stale}` : null,
              summaryData.truncated ? "仅分析最近 250 个 Saved Keywords" : null,'''
          text = replace_once(text, summary_old, summary_new, "intelligence summary evidence coverage")

          render_old = '''      const row = documentLike.createElement("tr");
              const cells = [
                item.keyword || "—",
                clusterIntelligenceDecisionLabel(item.decision?.code, item.decision?.label),
                item.suggested_cluster
                  ? `${item.suggested_cluster.name || "Unnamed"} · ${item.suggested_cluster.score ?? "—"}`
                  : "—",
                item.suggested_cluster?.score ?? "—",
                `${clusterIntelligenceRiskLabel(item.cannibalization?.level)} · ${item.cannibalization?.score ?? 0}`,
                Array.isArray(item.reasons) && item.reasons.length ? item.reasons.join(" ") : "—",
                item.decision?.next_action || "—",
              ];
              cells.forEach((value, index) => {
                const cell = documentLike.createElement("td");
                cell.textContent = String(value);
                if (index === 4) {
                  cell.dataset.risk = String(item.cannibalization?.level || "none");
                }
                row.appendChild(cell);
              });'''
          render_new = '''      const row = documentLike.createElement("tr");
              const evidence = clusterSerpEvidencePresentation(item.serp_overlap);
              const confidence = clusterConfidencePresentation(item.confidence);
              const cells = [
                item.keyword || "—",
                clusterIntelligenceDecisionLabel(item.decision?.code, item.decision?.label),
                item.suggested_cluster
                  ? `${item.suggested_cluster.name || "Unnamed"} · ${item.suggested_cluster.score ?? "—"}`
                  : "—",
                item.components?.final_match_score ?? item.suggested_cluster?.score ?? "—",
                evidence.label,
                evidence.shared_label,
                confidence.score == null ? confidence.label : `${confidence.label} · ${confidence.score}`,
                `${clusterIntelligenceRiskLabel(item.cannibalization?.level)} · ${item.cannibalization?.score ?? 0}`,
                Array.isArray(item.reasons) && item.reasons.length ? item.reasons.join(" ") : "—",
                item.decision?.next_action || "—",
              ];
              cells.forEach((value, index) => {
                const cell = documentLike.createElement("td");
                cell.textContent = String(value);
                if (index === 4) {
                  cell.className = "v2-serp-evidence-cell";
                  cell.dataset.evidenceStatus = evidence.status;
                  cell.dataset.evidenceStrength = evidence.strength;
                  cell.title = item.serp_overlap?.reason || "当前没有可用的 SERP overlap 证据。";
                }
                if (index === 5 && evidence.shared_urls.length) {
                  cell.className = "v2-serp-shared-urls";
                  cell.title = evidence.shared_urls.join("\n");
                }
                if (index === 6) {
                  cell.className = "v2-cluster-confidence";
                  cell.dataset.confidence = confidence.level;
                  cell.title = confidence.reason || "当前没有置信度说明。";
                }
                if (index === 7) {
                  cell.dataset.risk = String(item.cannibalization?.level || "none");
                  cell.title = item.cannibalization?.reason || "";
                }
                row.appendChild(cell);
              });'''
          text = replace_once(text, render_old, render_new, "intelligence evidence row rendering")

          empty_old = '''      cell.colSpan = 8;
              cell.className = "emptyrow";'''
          empty_new = '''      cell.colSpan = 11;
              cell.className = "emptyrow";'''
          text = replace_once(text, empty_old, empty_new, "empty intelligence colspan")
          js_path.write_text(text)

          css_path = Path("public/v2-shell.css")
          css = css_path.read_text()
          marker = "/* Cluster Intelligence v0.2 evidence UI */"
          if marker not in css:
              css += r'''

          /* Cluster Intelligence v0.2 evidence UI */
          .v2-cluster-intelligence-table{
            min-width:1520px;
          }
          .v2-cluster-intelligence-table .v2-serp-evidence-cell,
          .v2-cluster-intelligence-table .v2-cluster-confidence{
            font-weight:750;
            white-space:nowrap;
          }
          .v2-serp-evidence-cell[data-evidence-status="available"][data-evidence-strength="strong"]{
            color:#92d7bd;
          }
          .v2-serp-evidence-cell[data-evidence-status="available"][data-evidence-strength="moderate"]{
            color:#ffd38c;
          }
          .v2-serp-evidence-cell[data-evidence-status="available"][data-evidence-strength="weak"]{
            color:#9fbce0;
          }
          .v2-serp-evidence-cell[data-evidence-status="stale"],
          .v2-serp-evidence-cell[data-evidence-status="insufficient"],
          .v2-serp-evidence-cell[data-evidence-status="market_mismatch"],
          .v2-serp-evidence-cell[data-evidence-status="unavailable"]{
            color:#7088a8;
          }
          .v2-serp-shared-urls{
            color:#9fc2f7;
            font-variant-numeric:tabular-nums;
            cursor:help;
          }
          .v2-cluster-confidence[data-confidence="high"]{
            color:#92d7bd;
          }
          .v2-cluster-confidence[data-confidence="medium"]{
            color:#a9c8f7;
          }
          .v2-cluster-confidence[data-confidence="low"]{
            color:#ffd38c;
          }
          .v2-serp-evidence-cell,
          .v2-serp-shared-urls,
          .v2-cluster-confidence,
          .v2-cluster-intelligence-table td[data-risk]{
            cursor:help;
          }
          '''
              css_path.write_text(css)

          test_path = Path("tests/keyword-library-ui.test.mjs")
          tests = test_path.read_text()
          tests = tests.replace(
              '''  clusterIntelligenceDecisionLabel,
            clusterIntelligenceRiskLabel,''',
              '''  clusterConfidencePresentation,
            clusterIntelligenceDecisionLabel,
            clusterIntelligenceRiskLabel,
            clusterSerpEvidencePresentation,''',
              1,
          )
          if 'test("Cluster Intelligence v0.2 presents SERP evidence and confidence explicitly"' not in tests:
              tests += r'''

          test("Cluster Intelligence v0.2 presents SERP evidence and confidence explicitly", () => {
            assert.deepEqual(clusterSerpEvidencePresentation({
              status: "available",
              strength: "strong",
              score: 40,
              shared_url_count: 4,
              shared_urls: ["a.com/page", "b.com/page"],
            }), {
              status: "available",
              strength: "strong",
              label: "强 · 40%",
              shared_label: "4 个",
              shared_urls: ["a.com/page", "b.com/page"],
            });
            assert.equal(clusterSerpEvidencePresentation({ status: "stale" }).label, "已过期");
            assert.equal(clusterSerpEvidencePresentation({ status: "insufficient" }).label, "证据不足");
            assert.deepEqual(clusterConfidencePresentation({
              level: "high",
              score: 90,
              reason: "真实 SERP 证据",
            }), {
              level: "high",
              label: "高",
              score: 90,
              reason: "真实 SERP 证据",
            });
          });

          test("Cluster Intelligence table exposes SERP overlap, shared URLs, confidence, and evidence coverage without paid calls", async () => {
            const source = await readFile(new URL("../public/v2-keyword-library.js", import.meta.url), "utf8");
            assert.match(source, /<th>SERP Overlap<\/th>/);
            assert.match(source, /<th>Shared URLs<\/th>/);
            assert.match(source, /<th>Confidence<\/th>/);
            assert.match(source, /SERP 证据 .*覆盖/);
            assert.match(source, /data\.evidenceStatus/);
            assert.match(source, /evidence\.shared_urls\.join/);
            assert.match(source, /data\.confidence/);
            assert.match(source, /colSpan = 11/);
            assert.doesNotMatch(source, /submitSeoResearchRequest|dataforseo\.com/i);
          });
          '''
              test_path.write_text(tests)
          PY
      - name: Validate
        run: |
          git diff --check
          node --test
      - name: Commit evidence UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2-keyword-library.js public/v2-shell.css tests/keyword-library-ui.test.mjs
          git commit -m "feat: expose Cluster SERP evidence in UI"
          git push origin HEAD:seo-pro-v2
