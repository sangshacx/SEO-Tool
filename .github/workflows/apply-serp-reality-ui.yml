name: Apply SERP Reality UI
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/apply-serp-reality-ui.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
      - name: Apply SERP Reality UI
        run: python .github/scripts/apply-serp-reality-ui.py
      - name: Run regression tests
        run: |
          git diff --check
          node --test
      - name: Commit and clean up
        run: |
          rm .github/workflows/apply-serp-reality-ui.yml
          rm .github/scripts/apply-serp-reality-ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v2.html tests/serp-reality-ui.test.mjs .github/workflows/apply-serp-reality-ui.yml .github/scripts/apply-serp-reality-ui.py
          git commit -m "feat: turn SERP weakness into SERP Reality"
          git push origin HEAD:seo-pro-v2
