name: Verify Keyword Gap Easy Wins

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - .github/workflows/verify-keyword-gap-easy-wins.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2

      - name: Run regression tests
        shell: bash
        run: |
          git diff --check HEAD^ HEAD || true
          node --test

      - name: Remove temporary workflow and commit cleanup
        shell: bash
        run: |
          rm .github/workflows/verify-keyword-gap-easy-wins.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-keyword-gap-easy-wins.yml
          git commit -m "chore: remove temporary easy wins check"
          git push origin HEAD:seo-pro-v2
