name: Competitor Intelligence V01
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/competitor-intelligence-v01.yml"
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
          fetch-depth: 0
      - name: Add deterministic competitor intelligence
        run: |
          cat > src/v2/intelligence/competitor-intelligence.js <<'EOF'
          export const COMPETITOR_INTELLIGENCE_VERSION = "competitor-intelligence-v0.1";

          const WEIGHTS = Object.freeze({
            visibility: 0.35,
            keyword_footprint: 0.25,
            commercial_signal: 0.20,
            actionability: 0.20,
          });

          function clamp(value, min = 0, max = 100) {
            return Math.min(max, Math.max(min, Number(value) || 0));
          }

          function round(value) {
            return Math.round(clamp(value));
          }

          function finite(value) {
            if (value === null || value === undefined || value === "") return null;
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
          }

          function logScale(value, cap) {
            const number = finite(value);
            if (number === null) return 50;
            if (number <= 0) return 0;
            return round((Math.log10(number + 1) / Math.log10(cap + 1)) * 100);
          }

          function sampleRows(rows) {
            return (Array.isArray(rows) ? rows : []).filter((row) => row?.keyword);
          }

          function commercialShare(rows) {
            if (!rows.length) return 50;
            const known = rows.filter((row) => row.intent);
            if (!known.length) return 50;
            const commercial = known.filter((row) => {
              const intent = String(row.intent || "").toLowerCase();
              return intent === "commercial" || intent === "transactional";
            }).length;
            return round((commercial / known.length) * 100);
          }

          function averageCpcScore(rows) {
            const values = rows.map((row) => finite(row.cpc_usd)).filter((value) => value !== null);
            if (!values.length) return 50;
            const average = values.reduce((sum, value) => sum + value, 0) / values.length;
            return round((Math.log10(average + 1) / Math.log10(6)) * 100);
          }

          function actionabilityScore(rows) {
            if (!rows.length) return 50;
            const measurable = rows.filter((row) =>
              finite(row.search_volume) !== null && finite(row.keyword_difficulty) !== null
            );
            const opportunityShare = measurable.length
              ? measurable.filter((row) =>
                  finite(row.search_volume) >= 100 && finite(row.keyword_difficulty) <= 50
                ).length / measurable.length
              : 0.5;
            const urlCoverage = rows.filter((row) => row.ranking_url).length / rows.length;
            return round(opportunityShare * 70 + urlCoverage * 30);
          }

          function confidenceScore(organic, rows) {
            const aggregateValues = [
              organic?.estimated_monthly_traffic,
              organic?.ranked_keywords,
              organic?.positions?.top_10,
              organic?.estimated_paid_traffic_cost_usd,
            ];
            const aggregateCompleteness = aggregateValues.filter((value) => finite(value) !== null).length / aggregateValues.length;
            const sampleSize = Math.min(rows.length / 20, 1);
            const rowCompleteness = rows.length
              ? rows.reduce((sum, row) => {
                  const fields = [row.position, row.search_volume, row.keyword_difficulty, row.intent, row.ranking_url];
                  return sum + fields.filter((value) => value !== null && value !== undefined && value !== "").length / fields.length;
                }, 0) / rows.length
              : 0;
            return round(25 + aggregateCompleteness * 35 + sampleSize * 20 + rowCompleteness * 20);
          }

          function decisionFor(score) {
            if (score >= 75) {
              return {
                code: "high_research_value",
                label: "高研究价值",
                next_action: "优先进入 Keyword Gap，验证其高价值关键词是否为本站真实缺口。",
              };
            }
            if (score >= 55) {
              return {
                code: "research_worthy",
                label: "值得继续研究",
                next_action: "先筛选 Top 10、商业词和较低 KD 关键词，再进入 Keyword Gap 验证。",
              };
            }
            if (score >= 35) {
              return {
                code: "selective_research",
                label: "选择性研究",
                next_action: "只研究与你站点主题高度相关的关键词，不必全面跟随该域名。",
              };
            }
            return {
              code: "low_priority_research",
              label: "低优先研究",
              next_action: "暂不扩大投入，优先研究与目标市场和主题更接近的竞争对手。",
            };
          }

          function explain({ factors, rows }) {
            const signals = [];
            const cautions = [];
            if (factors.visibility >= 70) signals.push("自然搜索可见度较强，具备持续拆解价值。");
            if (factors.keyword_footprint >= 70) signals.push("排名关键词覆盖面较大，可提供更多主题与页面线索。");
            if (factors.commercial_signal >= 65) signals.push("商业意图 / CPC / 流量价值信号较强。");
            if (factors.actionability >= 65) signals.push("样本中存在较多可进一步验证的关键词机会。");
            if (!signals.length) {
              const strongest = Object.entries(factors).sort((a, b) => b[1] - a[1])[0];
              signals.push(`当前最强信号：${strongest?.[0] || "data"} ${strongest?.[1] ?? 0}/100。`);
            }
            if (rows.length < 20) cautions.push("排名关键词样本较少，结论置信度受限。");
            if (factors.actionability < 40) cautions.push("当前样本中可直接转化为关键词行动的信号有限。");
            if (factors.commercial_signal < 40) cautions.push("商业意图和付费价值信号偏弱。");
            return { signals: signals.slice(0, 3), cautions: cautions.slice(0, 3) };
          }

          export function buildCompetitorSnapshotIntelligence({
            domain = null,
            organic = {},
            top_keywords = [],
          } = {}) {
            const rows = sampleRows(top_keywords);
            const visibility = round(
              logScale(organic?.estimated_monthly_traffic, 100000) * 0.65
              + logScale(organic?.positions?.top_10, 10000) * 0.35
            );
            const keywordFootprint = logScale(organic?.ranked_keywords, 100000);
            const commercialSignal = round(
              commercialShare(rows) * 0.55
              + averageCpcScore(rows) * 0.25
              + logScale(organic?.estimated_paid_traffic_cost_usd, 10000) * 0.20
            );
            const actionability = actionabilityScore(rows);
            const factors = {
              visibility,
              keyword_footprint: keywordFootprint,
              commercial_signal: commercialSignal,
              actionability,
            };
            const score = round(
              visibility * WEIGHTS.visibility
              + keywordFootprint * WEIGHTS.keyword_footprint
              + commercialSignal * WEIGHTS.commercial_signal
              + actionability * WEIGHTS.actionability
            );
            const confidence = confidenceScore(organic, rows);
            const decision = decisionFor(score);
            const explanation = explain({ factors, rows });

            return {
              version: COMPETITOR_INTELLIGENCE_VERSION,
              domain,
              score,
              confidence_score: confidence,
              decision,
              factors,
              weights: WEIGHTS,
              signals: explanation.signals,
              cautions: explanation.cautions,
              sample: {
                ranked_keyword_rows: rows.length,
                commercial_rows: rows.filter((row) => ["commercial", "transactional"].includes(String(row.intent || "").toLowerCase())).length,
                actionable_rows: rows.filter((row) => finite(row.search_volume) >= 100 && finite(row.keyword_difficulty) <= 50).length,
              },
              disclaimer: "Competitor Research Value 是基于当前 SEO 指标和最多 50 个排名关键词样本的确定性研究优先级，不代表对手真实收入、业务规模或最终可超越概率。",
            };
          }
          EOF

          cat > public/v2-competitor-intelligence-ui.js <<'EOF'
          export function competitorIntelligencePresentation(intelligence = {}) {
            const score = Number.isFinite(Number(intelligence?.score)) ? Number(intelligence.score) : null;
            const confidence = Number.isFinite(Number(intelligence?.confidence_score)) ? Number(intelligence.confidence_score) : null;
            return {
              score,
              score_label: score == null ? "—" : String(score),
              decision_label: intelligence?.decision?.label || "等待 Snapshot",
              next_action: intelligence?.decision?.next_action || "先运行竞争对手自然搜索概览。",
              confidence_label: confidence == null ? "—" : `${confidence}/100`,
            };
          }

          function listItems(documentLike, target, items, emptyText) {
            target.replaceChildren();
            const rows = Array.isArray(items) ? items : [];
            if (!rows.length) {
              const li = documentLike.createElement("li");
              li.textContent = emptyText;
              target.appendChild(li);
              return;
            }
            rows.forEach((value) => {
              const li = documentLike.createElement("li");
              li.textContent = value;
              target.appendChild(li);
            });
          }

          export function mountCompetitorIntelligence({
            root,
            competitorWorkspace,
            eventTarget = globalThis.window,
            documentLike = globalThis.document,
          } = {}) {
            const panel = root?.querySelector?.(".v2-competitor-snapshot-panel");
            const result = panel?.querySelector?.("#competitorResult");
            const gapInput = root?.querySelector?.("#gapCompetitorDomain");
            if (!panel || !result || !documentLike) return () => {};

            const card = documentLike.createElement("section");
            card.className = "v2-competitor-intelligence-card";
            card.dataset.v2CompetitorIntelligence = "";
            card.hidden = true;
            card.innerHTML = `
              <div class="v2-competitor-intelligence-head">
                <div>
                  <div class="v2-competitor-intelligence-eyebrow">COMPETITOR INTELLIGENCE · v0.1</div>
                  <h3>Competitor Research Value</h3>
                  <p>判断这个域名值不值得继续投入研究，以及下一步应该验证什么。</p>
                </div>
                <div class="v2-competitor-intelligence-score">
                  <b data-v2-competitor-intelligence-score>—</b>
                  <span data-v2-competitor-intelligence-decision>等待 Snapshot</span>
                  <small data-v2-competitor-intelligence-confidence>Confidence —</small>
                </div>
              </div>
              <div class="v2-competitor-intelligence-factors">
                <div><span>Visibility</span><b data-v2-ci-factor="visibility">—</b><small>35%</small></div>
                <div><span>Keyword Footprint</span><b data-v2-ci-factor="keyword_footprint">—</b><small>25%</small></div>
                <div><span>Commercial Signal</span><b data-v2-ci-factor="commercial_signal">—</b><small>20%</small></div>
                <div><span>Actionability</span><b data-v2-ci-factor="actionability">—</b><small>20%</small></div>
              </div>
              <div class="v2-competitor-intelligence-detail">
                <div><b>为什么值得看</b><ul data-v2-ci-signals></ul></div>
                <div><b>限制 / 注意</b><ul data-v2-ci-cautions></ul></div>
              </div>
              <div class="v2-competitor-intelligence-next">
                <div>
                  <span>下一步</span>
                  <b data-v2-ci-next>先运行 Snapshot。</b>
                  <small data-v2-ci-disclaimer></small>
                </div>
                <button type="button" data-v2-ci-gap>去验证 Keyword Gap</button>
              </div>
            `;
            result.before(card);

            let currentDomain = "";
            const render = (detail = {}) => {
              const intelligence = detail.intelligence;
              if (!intelligence) return;
              currentDomain = detail.domain || intelligence.domain || "";
              const view = competitorIntelligencePresentation(intelligence);
              card.querySelector("[data-v2-competitor-intelligence-score]").textContent = view.score_label;
              card.querySelector("[data-v2-competitor-intelligence-decision]").textContent = view.decision_label;
              card.querySelector("[data-v2-competitor-intelligence-confidence]").textContent = `Confidence ${view.confidence_label}`;
              Object.entries(intelligence.factors || {}).forEach(([key, value]) => {
                const target = card.querySelector(`[data-v2-ci-factor="${key}"]`);
                if (target) target.textContent = value == null ? "—" : String(value);
              });
              listItems(documentLike, card.querySelector("[data-v2-ci-signals]"), intelligence.signals, "当前没有明显强项信号。");
              listItems(documentLike, card.querySelector("[data-v2-ci-cautions]"), intelligence.cautions, "当前样本没有额外限制提示。");
              card.querySelector("[data-v2-ci-next]").textContent = view.next_action;
              card.querySelector("[data-v2-ci-disclaimer]").textContent = `${intelligence.version || "competitor-intelligence-v0.1"} · ${intelligence.disclaimer || ""}`;
              card.hidden = false;
            };

            const handleSnapshot = (event) => render(event?.detail || {});
            eventTarget?.addEventListener?.("seo-pro-v2:competitor-snapshot-ready", handleSnapshot);

            const gapButton = card.querySelector("[data-v2-ci-gap]");
            gapButton.addEventListener("click", () => {
              if (!currentDomain || !gapInput) return;
              gapInput.value = currentDomain;
              competitorWorkspace?.activateTab?.("gap");
              gapInput.focus?.();
            });

            return () => {
              eventTarget?.removeEventListener?.("seo-pro-v2:competitor-snapshot-ready", handleSnapshot);
              card.remove?.();
            };
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          # API: enrich both live and old cached snapshots without extra provider requests.
          path = Path("functions/api/v2/competitors/snapshot.js")
          text = path.read_text()
          text = replace_once(
              text,
              'import { buildCompetitorSnapshotCacheKey } from "../../../../src/v2/dashboard/cache-keys.js";',
              'import { buildCompetitorSnapshotCacheKey } from "../../../../src/v2/dashboard/cache-keys.js";\nimport { buildCompetitorSnapshotIntelligence } from "../../../../src/v2/intelligence/competitor-intelligence.js";',
              "snapshot intelligence import",
          )
          marker = 'function normalizeResult(result, domain) {'
          helper = '''function enrichSnapshot(data) {
            if (!data) return data;
            return {
              ...data,
              intelligence: buildCompetitorSnapshotIntelligence(data),
            };
          }

          '''
          text = replace_once(text, marker, helper + marker, "snapshot enrich helper")
          text = replace_once(
              text,
              'if (cachedData) { await usage(env, { requestId, taskCount: 0, resultCount: cachedData.top_keywords?.length ?? 0, actualCostUsd: 0, cacheHit: true, status: "success", httpStatus: 200, durationMs: Date.now() - startedAt }); return json({ ok: true, data: cachedData, meta: { request_id: requestId, cached: true, actual_cost_usd: 0, cache_ttl_days: 7, cached_at: cached?.cached_at ?? null } }); }',
              'if (cachedData) { const data = enrichSnapshot(cachedData); await usage(env, { requestId, taskCount: 0, resultCount: data.top_keywords?.length ?? 0, actualCostUsd: 0, cacheHit: true, status: "success", httpStatus: 200, durationMs: Date.now() - startedAt }); return json({ ok: true, data, meta: { request_id: requestId, cached: true, actual_cost_usd: 0, cache_ttl_days: 7, cached_at: cached?.cached_at ?? null } }); }',
              "cached snapshot enrichment",
          )
          text = replace_once(
              text,
              'const data = normalizeResult(task.result?.[0], domain), cost =',
              'const data = enrichSnapshot(normalizeResult(task.result?.[0], domain)), cost =',
              "live snapshot enrichment",
          )
          path.write_text(text)

          # Local table emits the already-returned snapshot to the UI layer.
          path = Path("public/v2-competitor-keywords.js")
          text = path.read_text()
          text = replace_once(
              text,
              '  locationLike = globalThis.location,\n  documentLike = globalThis.document,\n  requestAnimationFrameImpl = globalThis.requestAnimationFrame,\n} = {}) {\n  let rows = [];',
              '  locationLike = globalThis.location,\n  documentLike = globalThis.document,\n  requestAnimationFrameImpl = globalThis.requestAnimationFrame,\n  eventTarget = globalThis.window,\n  customEventFactory = (type, detail) => typeof globalThis.CustomEvent === "function"\n    ? new globalThis.CustomEvent(type, { detail })\n    : { type, detail },\n} = {}) {\n  let rows = [];',
              "competitor table event options",
          )
          text = replace_once(
              text,
              '''    setRows(nextRows) {
                rows = Array.isArray(nextRows) ? nextRows : [];
                page = 1;
                return render();
              },''',
              '''    setRows(nextRows, metadata = {}) {
                rows = Array.isArray(nextRows) ? nextRows : [];
                page = 1;
                const model = render();
                eventTarget?.dispatchEvent?.(customEventFactory("seo-pro-v2:competitor-snapshot-ready", {
                  ...metadata,
                  domain: metadata.domain || competitorDomainInput?.value || "",
                  top_keywords: rows,
                }));
                return model;
              },''',
              "competitor table snapshot event",
          )
          path.write_text(text)

          # Pass the exact API intelligence/aggregate data through the existing table surface.
          path = Path("public/v2.html")
          text = path.read_text()
          text = replace_once(
              text,
              'competitorKeywordTable.setRows(data.top_keywords||[]);',
              'competitorKeywordTable.setRows(data.top_keywords||[],{domain:data.domain,organic,intelligence:data.intelligence});',
              "snapshot metadata handoff",
          )
          path.write_text(text)

          # Shell mounts the intelligence UI into the existing Competitor workspace.
          path = Path("public/v2-shell.js")
          text = path.read_text()
          text = replace_once(
              text,
              '} from "./v2-keyword-library.js";',
              '} from "./v2-keyword-library.js";\nimport { mountCompetitorIntelligence } from "./v2-competitor-intelligence-ui.js";',
              "competitor intelligence UI import",
          )
          text = replace_once(
              text,
              '  createCompetitorResearchWorkspace(content);',
              '  const competitorWorkspace = createCompetitorResearchWorkspace(content);',
              "competitor workspace reference",
          )
          text = replace_once(
              text,
              '  let dashboardCleanup = () => {};\n  let keywordLibraryCleanup = () => {};\n  let clusterSerpVerificationCleanup = () => {};',
              '  let dashboardCleanup = () => {};\n  let keywordLibraryCleanup = () => {};\n  let competitorIntelligenceCleanup = () => {};\n  let clusterSerpVerificationCleanup = () => {};',
              "competitor intelligence cleanup",
          )
          text = replace_once(
              text,
              '      keywordLibraryCleanup = mountKeywordLibrary({ root: shell, context, fetchImpl });\n      clusterSerpVerificationCleanup();',
              '      keywordLibraryCleanup = mountKeywordLibrary({ root: shell, context, fetchImpl });\n      competitorIntelligenceCleanup();\n      competitorIntelligenceCleanup = mountCompetitorIntelligence({ root: shell, competitorWorkspace });\n      clusterSerpVerificationCleanup();',
              "competitor intelligence mount",
          )
          path.write_text(text)

          # Styling.
          path = Path("public/v2-shell.css")
          text = path.read_text()
          if "/* Competitor Intelligence v0.1 */" not in text:
              text += r'''

          /* Competitor Intelligence v0.1 */
