          }
          @media(max-width:760px){
            .v2-competitor-intelligence-head,
            .v2-competitor-intelligence-next{flex-direction:column}
            .v2-competitor-intelligence-score{text-align:left}
            .v2-competitor-intelligence-factors{grid-template-columns:1fr 1fr}
            .v2-competitor-intelligence-detail{grid-template-columns:1fr}
