name: Phase 09 Organic Intelligence Tests

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - src/v2/providers/dataforseo-ranked-keywords.js
      - src/v2/organic/organic-keywords-cache.js
      - functions/api/v2/organic/keywords.js
      - src/v2/providers/dataforseo-relevant-pages.js
      - src/v2/organic/organic-pages-cache.js
      - src/v2/intelligence/organic-page-actions.js
      - functions/api/v2/organic/pages.js
      - src/v2/organic/organic-position-changes.js
      - functions/api/v2/organic/changes.js
      - src/v2/intelligence/organic-competitor-relevance.js
      - src/v2/providers/dataforseo-organic-competitors.js
      - src/v2/organic/organic-competitors-cache.js
      - functions/api/v2/organic/competitors.js
      - src/v2/intelligence/organic-keyword-actions.js
      - public/v2-organic-intelligence.js
      - public/v2-organic-intelligence.css
      - public/v2-shell.js
      - tests/dataforseo-ranked-keywords.test.mjs
      - tests/organic-keywords-cache.test.mjs
      - tests/organic-keywords-api.test.mjs
      - tests/organic-keyword-actions.test.mjs
      - tests/organic-intelligence-ui.test.mjs
      - tests/organic-shell-integration.test.mjs
      - tests/dataforseo-relevant-pages.test.mjs
      - tests/organic-pages-cache.test.mjs
      - tests/organic-page-actions.test.mjs
      - tests/organic-pages-api.test.mjs
      - tests/organic-position-changes.test.mjs
      - tests/organic-changes-api.test.mjs
      - tests/organic-competitor-relevance.test.mjs
      - tests/dataforseo-organic-competitors.test.mjs
      - tests/organic-competitors-cache.test.mjs
      - tests/organic-competitors-api.test.mjs
      - .github/workflows/phase09-organic-intelligence-tests.yml

permissions:
  contents: read

jobs:
  test-organic-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 09 Organic Intelligence tests
        run: node --test tests/dataforseo-ranked-keywords.test.mjs tests/organic-keywords-cache.test.mjs tests/organic-keywords-api.test.mjs tests/organic-keyword-actions.test.mjs tests/organic-intelligence-ui.test.mjs tests/organic-shell-integration.test.mjs tests/dataforseo-relevant-pages.test.mjs tests/organic-pages-cache.test.mjs tests/organic-page-actions.test.mjs tests/organic-pages-api.test.mjs tests/organic-position-changes.test.mjs tests/organic-changes-api.test.mjs tests/organic-competitor-relevance.test.mjs tests/dataforseo-organic-competitors.test.mjs tests/organic-competitors-cache.test.mjs tests/organic-competitors-api.test.mjs
