name: Phase 12 AI Visibility Tests

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - src/v2/providers/dataforseo-ai-visibility.js
      - src/v2/providers/dataforseo-llm-responses.js
      - src/v2/ai/ai-visibility-cache.js
      - src/v2/ai/prompt-tracker-cache.js
      - src/v2/storage/ai-visibility.js
      - src/v2/storage/ai-prompt-tracker.js
      - src/v2/intelligence/ai-visibility-actions.js
      - src/v2/intelligence/ai-prompt-trends.js
      - src/v2/intelligence/ai-prompt-actions.js
      - src/v2/intelligence/ai-prompt-outcomes.js
      - migrations/0018_ai_visibility_history.sql
      - migrations/0019_ai_prompt_tracker.sql
      - migrations/0020_ai_prompt_workflow_links.sql
      - functions/api/v2/ai/visibility.js
      - functions/api/v2/ai/history.js
      - functions/api/v2/ai/compare.js
      - functions/api/v2/ai/pages.js
      - functions/api/v2/ai/mentions.js
      - functions/api/v2/ai/prompt-models.js
      - functions/api/v2/ai/prompt-test.js
      - functions/api/v2/ai/prompt-tracker.js
      - functions/api/v2/gsc/generative-ai-sync.js
      - src/v2/storage/gsc-generative-ai.js
      - src/v2/intelligence/gsc-generative-ai-trends.js
      - migrations/0021_gsc_search_appearance_capabilities.sql
      - migrations/0022_gsc_generative_ai_daily.sql
      - functions/api/v2/organic/opportunities.js
      - functions/api/v2/organic/action-workflow.js
      - public/v2-ai-visibility.js
      - public/v2-ai-visibility.css
      - public/v2-organic-opportunity-ui.js
      - public/v2-organic-intelligence.css
      - public/v2-shell.js
      - public/v2.html
      - tests/dataforseo-ai-visibility.test.mjs
      - tests/dataforseo-llm-responses.test.mjs
      - tests/ai-prompt-tracker-api.test.mjs
      - tests/ai-prompt-tracker-storage.test.mjs
      - tests/ai-prompt-trends.test.mjs
      - tests/ai-prompt-actions.test.mjs
      - tests/ai-prompt-outcomes.test.mjs
      - tests/ai-prompt-tracker-management-api.test.mjs
      - tests/ai-visibility-api.test.mjs
      - tests/ai-visibility-secondary-api.test.mjs
      - tests/ai-visibility-storage.test.mjs
      - tests/ai-visibility-history-api.test.mjs
      - tests/ai-visibility-actions.test.mjs
      - tests/organic-opportunities-api.test.mjs
      - tests/seo-action-workflow-api.test.mjs
      - tests/dashboard-test-helpers.mjs
      - tests/ai-visibility-ui.test.mjs
      - tests/gsc-generative-ai-trends.test.mjs
      - tests/organic-opportunity-ui.test.mjs
      - tests/v2-dashboard-view.test.mjs
      - tests/v2-shell-navigation.test.mjs
      - docs/phase12-ai-search-visibility.md
      - .github/workflows/phase12-ai-visibility-tests.yml

permissions:
  contents: read

jobs:
  test-ai-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 12 AI visibility provider tests
        run: node --test tests/dataforseo-ai-visibility.test.mjs tests/dataforseo-llm-responses.test.mjs tests/ai-prompt-tracker-api.test.mjs tests/ai-prompt-tracker-storage.test.mjs tests/ai-prompt-trends.test.mjs tests/ai-prompt-actions.test.mjs tests/ai-prompt-outcomes.test.mjs tests/ai-prompt-tracker-management-api.test.mjs tests/ai-visibility-api.test.mjs tests/ai-visibility-secondary-api.test.mjs tests/ai-visibility-storage.test.mjs tests/ai-visibility-history-api.test.mjs tests/ai-visibility-ui.test.mjs tests/gsc-generative-ai-trends.test.mjs tests/v2-shell-navigation.test.mjs tests/ai-visibility-actions.test.mjs tests/organic-opportunities-api.test.mjs tests/seo-action-workflow-api.test.mjs tests/organic-opportunity-ui.test.mjs tests/v2-dashboard-view.test.mjs
