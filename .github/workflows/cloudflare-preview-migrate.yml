name: Apply Preview D1 Migration

on:
  push:
    branches:
      - seo-pro-v2
    paths:
      - .github/workflows/cloudflare-preview-migrate.yml
      - migrations/*.sql
      - wrangler.migrations.jsonc

permissions:
  contents: read

jobs:
  migrate-preview-d1:
    name: Migrate seo-pro-v2-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out seo-pro-v2
        uses: actions/checkout@v5

      - name: Verify Preview credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Confirm Preview D1 target
        run: npx --yes wrangler@4 d1 info seo-pro-v2-preview

      - name: Enforce public-only fetch routing for Preview
        shell: bash
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/seo-tool"
          project_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$project_url")"
          preview_flags="$(echo "$project_json" | jq --compact-output \
            '[.result.deployment_configs.preview.compatibility_flags[]?] + ["global_fetch_strictly_public"] | unique')"
          payload="$(jq --null-input --compact-output --argjson flags "$preview_flags" \
            '{deployment_configs:{preview:{compatibility_flags:$flags}}}')"
          updated_json="$(curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$project_url")"
          echo "$updated_json" | jq --exit-status \
            '.success == true and (.result.deployment_configs.preview.compatibility_flags | index("global_fetch_strictly_public") != null)'

      - name: Apply tracked migrations to Preview D1
        run: >
          npx --yes wrangler@4 d1 migrations apply seo-pro-v2-preview --remote
          --config wrangler.migrations.jsonc

      - name: Verify Preview D1 tables
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM sqlite_master
          WHERE type = 'table'
          AND name IN ('keywords', 'keyword_metrics', 'api_usage', 'app_settings', 'serp_weakness_snapshots', 'serp_competitor_snapshots', 'serp_competitor_pages', 'saved_keywords', 'saved_keyword_tags', 'saved_keyword_tag_assignments', 'topic_clusters', 'topic_cluster_members', 'keyword_idea_runs', 'keyword_idea_members', 'backlink_snapshots', 'backlink_opportunities', 'site_profiles', 'site_dashboard_snapshots', 'dashboard_refresh_leases', 'gsc_connections', 'gsc_site_mappings', 'gsc_search_analytics_daily', 'gsc_sync_runs', 'seo_action_workflow', 'seo_action_workflow_events', 'ai_visibility_history', 'ai_visibility_new_lost', 'ai_prompt_trackers', 'ai_prompt_observations', 'ai_prompt_workflow_links'
          ORDER BY name;" |
          node scripts/assert-d1-query-names.mjs \
          api_usage app_settings backlink_opportunities backlink_snapshots dashboard_refresh_leases gsc_connections gsc_search_analytics_daily gsc_site_mappings gsc_sync_runs keyword_idea_members \
          keyword_idea_runs keyword_metrics keywords saved_keyword_tag_assignments saved_keyword_tags saved_keywords topic_cluster_members topic_clusters serp_competitor_pages serp_competitor_snapshots serp_weakness_snapshots site_dashboard_snapshots site_profiles seo_action_workflow seo_action_workflow_events ai_visibility_history ai_visibility_new_lost ai_prompt_trackers ai_prompt_observations ai_prompt_workflow_links

      - name: Verify Preview Saved Keywords tables
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('saved_keywords') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id keyword_id source note created_at updated_at
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('saved_keyword_tags') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id name normalized_name created_at
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('saved_keyword_tag_assignments') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          saved_keyword_id tag_id created_at

      - name: Verify Preview SEO action workflow table
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('seo_action_workflow') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id page_url action_code query_text status note snooze_until last_priority_score \
          first_seen_at last_seen_at created_at updated_at

      - name: Verify Preview SEO action workflow events table
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('seo_action_workflow_events') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id workflow_id page_url action_code query_text from_status to_status \
          note_snapshot snooze_until priority_score created_at

      - name: Verify Preview AI visibility history tables
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('ai_visibility_history') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id platform location_code language_code period mentions ai_search_volume source provider_fetched_at created_at updated_at
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('ai_visibility_new_lost') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id platform location_code language_code period new_mentions lost_mentions new_ai_search_volume lost_ai_search_volume source provider_fetched_at created_at updated_at

      - name: Verify Preview AI prompt tracker tables
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('ai_prompt_trackers') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_profile_id name platform model_name prompt_text web_search location_code language_code status created_at updated_at
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('ai_prompt_observations') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id tracker_id model_name observed_at provider_datetime target_domain_mentioned target_domain_cited citation_count citation_domains_json fan_out_count input_tokens output_tokens actual_cost_usd model_money_spent_usd created_at

      - name: Verify Preview AI prompt workflow link table
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('ai_prompt_workflow_links') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          workflow_id tracker_id linked_at updated_at

      - name: Verify Preview outreach intelligence columns
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('backlink_opportunities')
          WHERE name IN ('quality_score', 'relevance_score', 'outreach_recommendation', 'outreach_confidence', 'outreach_reasons_json', 'outreach_risk_types_json', 'relevance_checked_at')
          ORDER BY name;" |
          node scripts/assert-d1-query-names.mjs \
          outreach_confidence outreach_reasons_json outreach_recommendation outreach_risk_types_json \
          quality_score relevance_checked_at relevance_score

      - name: Verify Preview site profile columns
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('site_profiles') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id domain label location_code location_name country_iso_code language_code language_name \
          include_subdomains competitors_json created_at updated_at

      - name: Verify Preview dashboard tables and api_usage nullability
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('site_dashboard_snapshots') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          id site_domain location_code language_code modules_json captured_at schema_version
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('dashboard_refresh_leases') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          lease_key request_id expires_at created_at
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('api_usage') WHERE name = 'task_count' AND \"notnull\" = 0;" |
          node scripts/assert-d1-query-names.mjs \
          task_count
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM pragma_table_info('site_dashboard_modules') ORDER BY cid;" |
          node scripts/assert-d1-query-names.mjs \
          site_domain location_code language_code module_id module_json updated_at schema_version revision

      - name: Verify Preview migration ledger
        shell: bash
        run: |
          npx --yes wrangler@4 d1 execute seo-pro-v2-preview --remote \
          --json \
          --command "SELECT name FROM d1_migrations
          WHERE name IN ('0006_backlink_outreach_intelligence.sql', '0007_site_profiles.sql', '0008_site_dashboard_snapshots.sql', '0009_nullable_api_usage_task_count.sql', '0010_atomic_dashboard_modules.sql', '0011_serp_competitor_pages.sql', '0012_saved_keywords.sql', '0013_keyword_clusters.sql', '0014_gsc_connections.sql', '0015_gsc_search_analytics.sql', '0016_seo_action_workflow.sql', '0017_seo_action_workflow_events.sql', '0018_ai_visibility_history.sql', '0019_ai_prompt_tracker.sql', '0020_ai_prompt_workflow_links.sql'
          ORDER BY name;" |
          node scripts/assert-d1-query-names.mjs \
          0006_backlink_outreach_intelligence.sql 0007_site_profiles.sql 0008_site_dashboard_snapshots.sql 0009_nullable_api_usage_task_count.sql 0010_atomic_dashboard_modules.sql 0011_serp_competitor_pages.sql 0012_saved_keywords.sql 0013_keyword_clusters.sql 0014_gsc_connections.sql 0015_gsc_search_analytics.sql 0016_seo_action_workflow.sql 0017_seo_action_workflow_events.sql 0018_ai_visibility_history.sql 0019_ai_prompt_tracker.sql 0020_ai_prompt_workflow_links.sql
