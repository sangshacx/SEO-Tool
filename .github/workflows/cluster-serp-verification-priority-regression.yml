name: Cluster SERP Verification Priority Regression
on:
  push:
    branches: [seo-pro-v2]
    paths:
      - ".github/workflows/cluster-serp-verification-priority-regression.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-pro-v2
      - name: Run regression tests
        run: |
          git diff --check
          node --test
